name: CI & Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eon-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q eon eon.py
      - name: Review repository privacy
        run: python scripts/check_repo_privacy.py
      - name: Validate frontend JavaScript syntax
        shell: bash
        run: node --check eon/ui/app.js && node --check eon/ui/chat.js

  release:
    name: Publish GitHub Release
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/v${version}.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Publish if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
            exit 0
          fi
          extra=()
          if [[ "$VERSION" == 0.* ]]; then extra+=(--prerelease --latest=false); fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EON v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md" \
            "${extra[@]}"
